[package]
name = "crudcrate"
version = "0.7.0"
edition = "2024"
description = "Rust traits and functions to aid in building CRUD APIs with Axum and Sea-ORM"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/evanjt/crudcrate"
keywords = ["crud", "api", "axum", "sea-orm"]
categories = ["web-programming", "database"]

[features]
default = ["full", "sqlite"]
# Full runtime with all CRUD operations, filtering, routing, etc.
full = ["derive", "dep:async-trait", "dep:axum", "dep:hyper", "dep:sea-orm", "dep:serde", "dep:serde_json", "dep:utoipa", "dep:uuid", "dep:tracing"]
# Minimal feature: only derive macros (ToCreateModel, ToUpdateModel, ToListModel, ToResponseModel)
# No runtime dependencies - generated code works with sea-orm, serde, serde_with only
derive = ["crudcrate-derive"]
mysql = ["sea-orm/sqlx-mysql"]
postgresql = ["sea-orm/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite"]
spring-rs = ["spring", "spring-web", "full"]

[dependencies]
# Proc macro dependency (optional)
crudcrate-derive = { version = "=0.7.0", optional = true, path = "../crudcrate-derive" }

# Always required for derive macros output
serde_with = { workspace = true }

# Runtime dependencies (optional, enabled by "full" feature)
async-trait = { workspace = true, optional = true }
axum = { workspace = true, features = ["macros"], optional = true }
hyper = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "macros", "with-uuid"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4"], optional = true }
tracing = { workspace = true, optional = true }

# Spring-RS dependencies (only for examples, behind feature flag)
spring = { version = "0.4.3", optional = true }
spring-web = { version = "0.4.3", optional = true }



[lib]
proc-macro = false

[dev-dependencies]
axum-helmet = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
criterion = { workspace = true, features = ["html_reports"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "macros", "with-chrono", "with-rust_decimal"] }
sea-orm-migration = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
tower_governor = { workspace = true }
url = { workspace = true }
url-escape = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono", "decimal"] }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
rust_decimal = { workspace = true }


[[example]]
name = "minimal"
path = "../examples/minimal/main.rs"
required-features = ["full"]

[[example]]
name = "crud_operations"
path = "../examples/crud_operations.rs"
required-features = ["full"]

[[example]]
name = "error_handling"
path = "../examples/error_handling.rs"
required-features = ["full"]

[[example]]
name = "recursive_join"
path = "../examples/recursive_join/main.rs"
required-features = ["full", "sqlite"]

[[example]]
name = "recursive_join_5_levels"
path = "../examples/recursive_join_5_levels/main.rs"
required-features = ["full", "sqlite"]


[[bench]]
name = "crud_benchmarks"
harness = false

[lints.clippy]
pedantic = "warn"
